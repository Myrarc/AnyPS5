name: PNG bit-depth validation
on:
  push:
    branches: [ci/pngdec-input-bit-depth]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          submodules: recursive
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config nasm libx11-dev libxext-dev libxrandr-dev libpipewire-0.3-dev libpulse-dev libasound2-dev libwayland-dev libxkbcommon-dev libegl-dev
      - name: Build unchanged production code with the new regression
        run: |
          mkdir -p validation-logs
          git show 3fb6a126fa80274dad6c488cbca8b40a0ba549cd:core/libs/prx/libScePngDec/Export.cpp > core/libs/prx/libScePngDec/Export.cpp
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON > validation-logs/configure.log 2>&1
          cmake --build build --target guest_png_dec_tests decoder_png_tests --parallel 2 > validation-logs/build-baseline.log 2>&1
      - name: Require the regression to fail before the fix
        shell: bash
        run: |
          set +e
          ctest --test-dir build -V -R '^guest_png_dec$' --no-tests=error --timeout 30 > validation-logs/regression-baseline.log 2>&1
          baseline_status=$?
          set -e
          cat validation-logs/regression-baseline.log
          test "$baseline_status" -eq 8
          if grep -Eq 'Timeout|Not Run|Could not find executable' validation-logs/regression-baseline.log; then exit 1; fi
      - name: Build all system libraries and the focused tests with the fix
        run: |
          git restore --source=d25b0730212da7f62b180f7a797bdf301927259a -- core/libs/prx/libScePngDec/Export.cpp
          git diff --exit-code d25b0730212da7f62b180f7a797bdf301927259a -- core/libs/prx/libScePngDec/Export.cpp core/libs/tests/GuestPngDec.cpp docs/dev/debt/libScePngDec.md
          cmake --build build --target libs guest_png_dec_tests decoder_png_tests --parallel 2 > validation-logs/build-patched.log 2>&1
      - name: Check decoded pixels and decoder regressions
        run: |
          ctest --test-dir build -V -R '^(guest_png_dec|decoder_png)$' --no-tests=error --timeout 30 --output-log validation-logs/ctest-patched.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: png-validation-logs
          path: validation-logs/
          retention-days: 14
